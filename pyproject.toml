[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ulak"
dynamic = ["version"]
description = "Drop-in HTTP(S) proxy hook: route all of a Python script's traffic through Burp/mitmproxy/ZAP with one import."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Musa SANA", email = "musa.sana@hotmail.com" }]
maintainers = [{ name = "Musa SANA", email = "musa.sana@hotmail.com" }]
keywords = ["proxy", "http", "https", "burp", "mitmproxy", "interception", "security", "monkeypatch", "debugging"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Software Development :: Testing",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

# No required dependencies: every HTTP library is patched only if it is present.

[project.optional-dependencies]
# Install the clients you want covered in tests, e.g. pip install ulak[test]
test = ["requests", "httpx", "aiohttp", "urllib3", "niquests", "httplib2", "curl_cffi", "pytest"]

[project.urls]
Homepage = "https://github.com/musana/ulak"
Repository = "https://github.com/musana/ulak"
Issues = "https://github.com/musana/ulak/issues"
Changelog = "https://github.com/musana/ulak/releases"

[tool.setuptools.dynamic]
version = { attr = "ulak.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
